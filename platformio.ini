[platformio]
default_envs = m5stopwatch

[env:m5stopwatch]
platform = espressif32 @ 6.12.0
framework = espidf
board = m5stack-cores3
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
; UI font subset (tools/build_font.py) and app list icon masks
; (tools/build_icons.py). The ESP-IDF component declares the same files with
; EMBED_FILES; PlatformIO generates the assembly that the build needs.
board_build.embed_files =
    src/ui/fonts/GenShinGothicMedium28.vlw
    src/ui/icons/AppIcons.bin
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/upload_guard.py
lib_deps =
    m5stack/M5Unified @ 0.2.16
    m5stack/M5GFX @ 0.2.28
    https://github.com/wararyo/M5StopWatch-MultiFirm.git#f5a8fd88f50dfb50c6e6e1e82bccc491a936bd47
build_flags =
    -DBOARD_HAS_PSRAM
    -DMULTIFIRM_HOST=1
    -Wno-error=maybe-uninitialized

; Explicit opt-in: inject 40ms processing overruns and count CPU1 idle execution.
[env:m5stopwatch-diagnostics]
extends = env:m5stopwatch
build_flags =
    ${env:m5stopwatch.build_flags}
    -DLAUNCHER_RUNTIME_DIAGNOSTICS=1

; Frame metrics only, on the product configuration: real RTC, real slots,
; real settings. This is what work 7 records baseline numbers from. Work 8-2
; adds the USB bus-activity history.
[env:m5stopwatch-measure]
extends = env:m5stopwatch
build_flags =
    ${env:m5stopwatch.build_flags}
    -DLAUNCHER_RENDER_METRICS=1
    -DLAUNCHER_USB_DIAG=1

; Pixel checks + synthetic display data + the same frame metrics. No 40ms load.
[env:m5stopwatch-render-check]
extends = env:m5stopwatch
build_flags =
    ${env:m5stopwatch.build_flags}
    -DLAUNCHER_RENDER_METRICS=1
    -DLAUNCHER_RENDER_DIAGNOSTICS=1

; Battery-voltage record for runs on battery (docs/task8/plan.md 8-0). Product
; behaviour plus a 1-minute PMIC read and a 15-minute NVS write; no frame metrics.
[env:m5stopwatch-drain]
extends = env:m5stopwatch
build_flags =
    ${env:m5stopwatch.build_flags}
    -DLAUNCHER_DRAIN_LOG=1
