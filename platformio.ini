[platformio]
default_envs = m5stopwatch

[env:m5stopwatch]
platform = espressif32 @ 6.12.0
framework = espidf
board = m5stack-cores3
board_build.partitions = partitions.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  m5stack/M5Unified @ 0.2.16
  m5stack/M5GFX @ 0.2.28

build_flags =
  -DBOARD_HAS_PSRAM
  -Wno-error=maybe-uninitialized
  # Uncomment to run the partial-repaint self-check and the frame-cost
  # benchmark at boot; see src/ui/RepaintCheck.h.
  # -DLAUNCHER_BENCH

